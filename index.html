<style>:root{color-scheme:light;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: an editorial menu. Studio photographs on a greige ground, thin-ruled spec cards laid over the empty part of each photo,
   one geometric display face, one flared serif for card titles, mono for data. A single photographic look, no dark variant. */
:root {
  color-scheme: light;
  --bg: #E6E0D5;
  --card: #EFEAE1;
  --ink: #1E1B17;
  --muted: #6C6559;
  --line: #1E1B1752;
  --hair: #1E1B1726;
  --dot: #C4572E;
  --ok: #3F6B3A;
  --stone: #CFC5B4;
  --font-display: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
  --font-serif: "Philosopher", "Optima", "Candara", Georgia, serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --st: env(safe-area-inset-top, 0px);
  --sb: env(safe-area-inset-bottom, 0px);
}
/* inside Telegram the insets come from Telegram alone, otherwise the notch is counted twice */
html.tg { --st: 0px; --sb: 0px; padding: 0 !important; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
/* no double-tap zoom and no rubber-band bounce: fast taps on the bottom bar must not move the page */
html { touch-action: manipulation; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; overscroll-behavior: none; }
body { overscroll-behavior: none; }
.dock button, .cta, .chip { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--font-display); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: calc(var(--st) + var(--tg-top, 0px)); z-index: 10; background: var(--bg); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; }
button:focus-visible, input:focus-visible { outline: 1px solid var(--ink); outline-offset: 3px; }
img { display: block; }

.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(104px + var(--sb) + var(--tg-bottom, 0px)); }
.mono { font: 400 11px/1.4 var(--font-mono); letter-spacing: .02em; }
.spaced { font: 400 11px/1.4 var(--font-mono); letter-spacing: .42em; text-transform: uppercase; color: var(--muted); }

/* top bar */
.wrap { padding-top: var(--tg-top, 0px); }
.bar { position: sticky; top: calc(var(--st) + var(--tg-top, 0px)); z-index: 5; background: var(--bg); display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-block: 14px 12px; border-bottom: 1px solid var(--hair); }
.bar .brand { font: 600 15px/1 var(--font-display); letter-spacing: .02em; text-transform: uppercase; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) calc(var(--sb) + var(--tg-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.dock-in { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); }
.dock button { position: relative; display: grid; justify-items: center; gap: 5px; padding: 12px 2px 11px; font: 400 9.5px/1 var(--font-mono); letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.dock svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; }
.dock button[aria-current="page"] { color: var(--ink); }
.dock button[aria-current="page"]::before { content: ""; position: absolute; top: -1px; left: 28%; right: 28%; height: 2px; background: var(--dot); }

/* poster: photo with the text laid over its empty upper part */
.poster { position: relative; margin-top: 14px; aspect-ratio: 2 / 3; max-width: 100%; overflow: hidden; background: var(--stone); }
.poster > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; }
.p-over { position: absolute; inset: 0; padding: 5% 6%; display: flex; flex-direction: column; align-items: flex-start; }
.p-top { width: 100%; display: flex; justify-content: space-between; align-items: start; gap: 12px; }
.pill { border: 1px solid var(--ink); border-radius: 99px; padding: 4px 12px; font: 400 11px/1.3 var(--font-mono); white-space: nowrap; }
.poster h1 { margin: 6% 0 0; font: 600 clamp(38px, 13vw, 68px)/.92 var(--font-display); letter-spacing: -.02em; text-transform: uppercase; }
.p-sub { margin: 10px 0 0; font-size: 15px; line-height: 1.25; }
.p-side { margin-top: 4.5%; display: grid; grid-template-columns: 54px minmax(0, 190px); gap: 12px; align-items: center; text-align: left; border-top: 1px solid var(--line); padding-top: 10px; }
.p-side .th { width: 54px; aspect-ratio: 3 / 4; }
.p-txt { display: grid; gap: 2px; font-size: 12.5px; line-height: 1.3; }
.p-txt b { font: 500 13px/1.2 var(--font-display); }
.p-txt em { font: 400 11px/1.3 var(--font-mono); font-style: normal; text-decoration: underline; text-underline-offset: 3px; }
.p-cta { margin-top: auto; }
.poster.short .p-side { display: none; }
.cta { display: inline-block; border: 1px solid var(--ink); padding: 11px 18px; font: 500 13px/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; background: color-mix(in srgb, var(--card) 70%, transparent); }
.cta.solid { background: var(--ink); color: var(--card); }
.cta:active { transform: translateY(1px); }

.lead { display: grid; gap: 14px; padding-block: 34px 8px; }
.lead p { margin: 0; font-size: 17px; line-height: 1.45; max-width: 34em; }
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: 44%; gap: 10px; overflow-x: auto; scrollbar-width: none; padding-bottom: 4px; }
.strip::-webkit-scrollbar { display: none; }
.tile { text-align: left; display: grid; gap: 8px; }
.tile img { width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: center 70%; }
.tile b { font: 700 16px/1.15 var(--font-serif); }
.tile span { color: var(--muted); }

/* plate = photo + spec card */
.sec-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 30px 14px; }
.sec-head h2 { margin: 0; font: 600 30px/1 var(--font-display); letter-spacing: -.01em; text-transform: uppercase; }
.plates { display: grid; gap: 28px; }
.plate { position: relative; display: block; width: 100%; text-align: left; aspect-ratio: 2 / 3; overflow: hidden; background: var(--stone); }
.plate > img { width: 100%; height: 100%; object-fit: cover; }
.plate .no { position: absolute; left: 4%; bottom: 4%; background: color-mix(in srgb, var(--card) 86%, transparent); color: var(--ink); padding: 5px 8px; letter-spacing: .3em; }
.plate .open { position: absolute; right: 4%; bottom: 4%; font: 400 11px/1 var(--font-mono); background: color-mix(in srgb, var(--card) 86%, transparent); border: 1px solid var(--line); padding: 6px 9px; }
.spec { position: absolute; top: 4%; left: 4%; width: min(76%, 300px); border: 1px solid var(--line); background: color-mix(in srgb, var(--card) 86%, transparent); padding: 10px 11px 0; display: grid; gap: 9px; }
.plate.r .spec { left: auto; right: 4%; }
.spec h3 { margin: 0; font: 700 17px/1.12 var(--font-serif); text-wrap: balance; }
.spec ul { margin: 0; padding: 0; list-style: none; font-size: 11.5px; line-height: 1.25; columns: 2; column-gap: 12px; }
.spec li { break-inside: avoid; }
.spec .sls { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.sl { display: grid; grid-template-columns: 58px 1fr; align-items: center; gap: 6px; font: 400 10px/1.5 var(--font-mono); }
.sl i { position: relative; height: 1px; background: var(--line); display: block; }
.sl i::before { content: ""; position: absolute; inset: -3px 0; background: linear-gradient(to right, var(--line) 1px, transparent 1px) 0 0 / calc(50% - .5px) 100%; }
.sl i::after { content: ""; position: absolute; top: -2.5px; left: calc(var(--v) * 100% - 3px); width: 6px; height: 6px; border-radius: 50%; background: var(--dot); }
.spec footer { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); margin-inline: -11px; padding: 6px 11px 7px; }
.spec footer span { font: 400 10px/1 var(--font-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.spec footer b { font: 400 15px/1 var(--font-serif); }

/* dish page */
.back { font: 400 12px/1 var(--font-mono); padding-block: 16px 12px; display: inline-block; }
/* Telegram shows its own Back button, ours would only take space */
html.tg .back { display: none; }
html.tg .dish-l { padding-top: 14px; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding-top: 16px; }
.controls .cta { text-align: center; }
.stepper { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; border-block: 1px solid var(--hair); padding-block: 10px; }
.stepper div { display: flex; align-items: center; gap: 14px; }
.stepper button { width: 34px; height: 34px; border: 1px solid var(--ink); border-radius: 50%; font-size: 18px; line-height: 1; }
.stepper b { font: 400 20px/1 var(--font-serif); min-width: 1ch; text-align: center; }
.rows { display: grid; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; padding-block: 10px; border-bottom: 1px solid var(--hair); align-items: baseline; }
.row .q { font: 400 12px/1.4 var(--font-mono); text-align: right; white-space: nowrap; }
.row .al { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; font: 400 11px/1.4 var(--font-mono); color: var(--dot); }
.row .al.ok { color: var(--muted); }
.link { font: 400 11px/1.4 var(--font-mono); border-bottom: 1px solid currentColor; color: var(--ink); }
.steps { display: grid; counter-reset: s; }
.step { display: grid; grid-template-columns: 44px 1fr; gap: 12px; padding-block: 14px; border-bottom: 1px solid var(--hair); text-align: left; width: 100%; align-items: start; }
.step .n { font: 400 22px/1 var(--font-serif); color: var(--muted); }
.step[aria-pressed="true"] .n { color: var(--dot); }
.step[aria-pressed="true"] .t { color: var(--muted); }
.step .tag { display: inline-block; margin-top: 6px; font: 400 10px/1 var(--font-mono); letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); padding: 4px 7px; margin-right: 6px; }
.notes { display: grid; gap: 14px; }
.notes p { margin: 0; }
.notes .k { display: block; margin-bottom: 3px; color: var(--muted); }

/* flow: round photos joined by thin lines */
.flow { display: grid; justify-items: center; }
.fcols { display: grid; width: 100%; }
.fcol { display: grid; justify-items: center; align-content: start; grid-auto-rows: min-content; text-align: center; padding-inline: 4px; min-width: 0; }
.srcs { display: flex; justify-content: center; padding-left: 10px; }
.srcs img, .srcs i { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; object-position: center 72%; margin-left: -10px; box-shadow: 0 0 0 2px var(--bg); background: var(--stone); }
.src { font: 400 10.5px/1.35 var(--font-mono); color: var(--muted); padding-top: 6px; text-wrap: balance; }
.vline { width: 1px; height: 18px; background: var(--line); position: relative; margin-block: 4px; }
.vline::after { content: ""; position: absolute; left: -3px; bottom: 0; width: 7px; height: 7px; border-right: 1px solid var(--ink); border-bottom: 1px solid var(--ink); transform: rotate(45deg); opacity: .55; }
.fn { display: grid; justify-items: center; gap: 5px; max-width: 100%; text-align: center; }
.fn .ph { width: 78px; height: 78px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; background: var(--card); box-shadow: 0 0 0 1px var(--line); font: 400 26px/1 var(--font-serif); color: var(--muted); }
.fn .ph img { width: 100%; height: 100%; object-fit: cover; }
.fn .cap { font-size: 13px; line-height: 1.2; text-wrap: balance; }
.fn small { font: 400 9.5px/1 var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.fn.done .ph { box-shadow: 0 0 0 2px var(--dot); }
.fn.big .ph { width: 132px; height: 132px; }
.fn.big .cap { font: 700 18px/1.15 var(--font-serif); }
.fmerge { width: 100%; height: auto; display: block; color: var(--ink); opacity: .55; }
.fend { font: 400 11px/1 var(--font-mono); letter-spacing: .42em; text-transform: uppercase; padding-top: 4px; }

/* illustrated steps */
.step.pic { grid-template-columns: 1fr; gap: 12px; padding-block: 18px; }
.step.pic > img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: var(--stone); }
.step.pic .body { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
.cook-img { width: 100%; aspect-ratio: 16 / 10; object-fit: cover; background: var(--stone); }

/* shop */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font: 400 12px/1.2 var(--font-mono); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.receipt { border: 1px solid var(--line); background: var(--card); padding: 14px 14px 0; margin-top: 16px; }
.receipt h3 { margin: 14px 0 2px; font: 400 10px/1 var(--font-mono); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }
.receipt h3:first-child { margin-top: 0; }
.item { display: grid; grid-template-columns: 18px 1fr auto; gap: 10px; align-items: center; padding-block: 8px; border-bottom: 1px solid var(--hair); cursor: pointer; }
.item input { appearance: none; width: 14px; height: 14px; border: 1px solid var(--ink); margin: 0; border-radius: 0; }
.item input:checked { background: var(--dot); border-color: var(--dot); }
.item.done span { text-decoration: line-through; color: var(--muted); }
.item .q { font: 400 12px/1 var(--font-mono); }
.receipt footer { display: flex; justify-content: space-between; align-items: baseline; margin-inline: -14px; padding: 10px 14px 12px; border-top: 1px solid var(--line); margin-top: -1px; }
.receipt footer b { font: 400 22px/1 var(--font-serif); }
.empty { border: 1px solid var(--line); padding: 22px 16px; display: grid; gap: 14px; justify-items: start; }
.empty p { margin: 0; }

/* overlays */
.veil { position: fixed; inset: 0; z-index: 20; background: #1E1B1766; display: grid; align-items: end; justify-items: center; }
.sheet { width: 100%; max-width: 520px; max-height: 92vh; overflow: auto; background: var(--bg); border-top: 1px solid var(--ink);
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + var(--sb) + var(--tg-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: grid; gap: 18px; align-content: start; }
.sheet.full { height: 100%; max-height: 100%; border-top: 0; padding-top: calc(18px + var(--st) + var(--tg-top, 0px)); grid-template-rows: auto auto 1fr auto; }
.sheet-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.sheet h2 { margin: 0; font: 600 26px/1 var(--font-display); text-transform: uppercase; letter-spacing: -.01em; }
.cook-no { font: 400 54px/1 var(--font-serif); color: var(--dot); }
.cook-text { margin: 0; font-size: 21px; line-height: 1.42; }
.cook-body { display: grid; gap: 18px; align-content: start; }
.timer { border: 1px solid var(--line); background: var(--card); padding: 14px; display: grid; gap: 12px; justify-items: start; }
.timer-val { font: 400 44px/1 var(--font-mono); font-variant-numeric: tabular-nums; }
.timer-val.end { color: var(--dot); }
.pair { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; }
.pair .cta { text-align: center; padding-block: 15px; }
.cta[disabled] { opacity: .3; cursor: default; }
.rule { height: 2px; background: var(--hair); position: relative; }
.rule i { position: absolute; inset: 0 auto 0 0; background: var(--dot); }
.toast { position: fixed; left: 50%; bottom: calc(88px + var(--sb)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--card); padding: 10px 16px; font: 400 12px/1.3 var(--font-mono); max-width: calc(100% - 32px); text-align: center; }
.foot { padding-top: 40px; display: grid; gap: 8px; color: var(--muted); }
.foot p { margin: 0; font-size: 12px; }

/* ---- shared small pieces ---- */
.muted { color: var(--muted); } .warn { color: var(--dot); } .ok { color: var(--ok); }
.up { text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-size: 10px; }
.noph { display: grid; place-items: center; width: 100%; height: 100%; background: var(--stone); font: 400 26px/1 var(--font-serif); color: var(--muted); }
.noph.big { position: absolute; inset: 0; font-size: 200px; align-items: end; padding-bottom: 12%; background: linear-gradient(165deg, #DCD3C3, var(--stone)); color: #1E1B1722; }
/* a dish without a photograph shows only its card, no empty poster */
.plate.bare { aspect-ratio: auto; background: none; overflow: visible; }
.plate.bare .noph.big { display: none; }
.plate.bare .spec { position: static; width: 100%; background: var(--card); }
.plate.bare .open { position: static; display: inline-block; margin-top: 8px; }
.th { display: block; width: 64px; aspect-ratio: 4 / 5; overflow: hidden; background: var(--stone); flex: none; }
.th img { width: 100%; height: 100%; object-fit: cover; object-position: center 70%; }
.th.big { width: 150px; }
.rowd { display: grid; grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: center; width: 100%; text-align: left; padding: 12px 0; border-bottom: 1px solid var(--hair); }
.rowd.static { cursor: default; }
.rowd .rb { display: grid; gap: 3px; min-width: 0; }
.rowd b { font: 700 17px/1.2 var(--font-serif); text-wrap: balance; }
.rowwrap { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; border-bottom: 1px solid var(--hair); }
.rowwrap .rowd { border-bottom: 0; }
.figs { width: 100%; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; text-align: left; border: 1px solid var(--line); background: var(--card); padding: 14px 14px 10px; }
.figs span { display: grid; gap: 5px; align-content: start; }
.figs b { font: 400 23px/1 var(--font-serif); white-space: nowrap; }
.figs i { font-style: normal; color: var(--muted); }
.figs em { grid-column: 1 / -1; font-style: normal; border-top: 1px solid var(--hair); padding-top: 9px; }
.search { width: 100%; border: 0; border-bottom: 1px solid var(--ink); background: none; padding: 10px 0; font: 400 16px/1.3 var(--font-display); border-radius: 0; -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--muted); }
.cats { display: flex; gap: 8px; overflow-x: auto; padding-block: 14px 16px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats .chip { flex: none; white-space: nowrap; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; border: 1px solid var(--ink); }
.seg button { padding: 11px 6px; font: 400 12px/1 var(--font-mono); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--card); }
.bud { display: flex; justify-content: space-between; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; padding-block: 8px 12px; }
.bud b { font: 400 26px/1 var(--font-serif); }
.receipt.day { margin-top: 14px; padding-bottom: 2px; }
.receipt.day.now { border-color: var(--ink); }
.day-h { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; padding-bottom: 6px; }
.day-h b { font: 700 19px/1.1 var(--font-serif); }
.item.wk { grid-template-columns: 74px minmax(0, 1fr) auto; width: 100%; text-align: left; }
.item.wk:last-child { border-bottom: 0; }
.blk { display: grid; gap: 10px; }
.opts { display: grid; gap: 8px; }
.opt { border: 1px solid var(--line); background: var(--card); padding: 11px 12px; text-align: left; display: grid; gap: 2px; }
.opt b { font: 700 16px/1.2 var(--font-serif); }
.opt span { font-size: 13px; line-height: 1.35; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.row.nut .nbar { grid-column: 1 / -1; height: 1px; background: var(--line); display: block; position: relative; margin-block: 3px; }
.row.nut .nbar i { position: absolute; left: 0; top: -1px; height: 3px; background: var(--dot); display: block; }
.row.nut .muted { grid-column: 1 / -1; }
.roul { display: grid; justify-items: center; gap: 8px; text-align: center; padding-block: 6px; }
.roul b { font: 700 24px/1.15 var(--font-serif); text-wrap: balance; }
.stamps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.stamp { aspect-ratio: 1; border-radius: 50%; border: 1px solid var(--dot); outline: 1px solid var(--dot); outline-offset: 3px; color: var(--dot); display: grid; place-content: center; text-align: center; padding: 10px; gap: 4px; transform: rotate(-7deg); margin: 4px; }
.stamp:nth-child(2n) { transform: rotate(5deg); }
.stamp i { font: 400 9px/1 var(--font-mono); font-style: normal; letter-spacing: .14em; text-transform: uppercase; }
.stamp b { font: 700 13px/1.1 var(--font-serif); text-wrap: balance; }
.stamp.big { width: 180px; } .stamp.big b { font-size: 20px; }
.spice { border-bottom: 1px solid var(--hair); }
.spice summary { list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; padding: 12px 0; cursor: pointer; }
.spice summary::-webkit-details-marker { display: none; }
.spice summary b { font: 700 16px/1.2 var(--font-serif); }
.spice[open] summary .mono { visibility: hidden; }
.spice > div { display: grid; gap: 8px; padding-bottom: 14px; }
.spice p { margin: 0; }
.spice .k { display: block; color: var(--muted); margin-bottom: 2px; }
.linkrow { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 12px; padding-top: 4px; }
.sheet h2 { text-wrap: balance; }

@media (min-width: 620px) {
  .wrap { max-width: 760px; }
  .plates { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .strip { grid-auto-columns: 30%; }
  .dock-in { max-width: 760px; }
  .step.pic { grid-template-columns: 220px 1fr; align-items: start; }
  .narrow, .flow { max-width: 620px; margin-inline: auto; }
}
@media (min-width: 960px) {
  .wrap { max-width: 1200px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); padding-bottom: 72px; }
  .bar { padding-block: 20px 18px; }
  .bar #stampLink { display: none; }
  /* the bottom bar becomes a plain text menu in the header */
  .dock { top: calc(var(--st) + var(--tg-top, 0px)); bottom: auto; left: 0; right: 0; border-top: 0; background: none; pointer-events: none; padding: 0 40px; }
  .dock-in { max-width: 1120px; display: flex; justify-content: flex-end; gap: 30px; }
  .dock button { pointer-events: auto; display: block; padding: 22px 0 20px; font-size: 11px; }
  .dock svg { display: none; }
  .dock button[aria-current="page"]::before { top: auto; bottom: 13px; left: 0; right: 0; height: 1px; background: var(--ink); }
  .toast { bottom: 28px; }

  .poster { aspect-ratio: auto; overflow: visible; background: none; display: grid; grid-template-columns: minmax(0, 1fr) minmax(340px, 40%); gap: 56px; margin-top: 28px; align-items: stretch; }
  .poster > img { position: static; grid-column: 2; grid-row: 1; width: 100%; height: min(760px, calc(100vh - 150px)); min-height: 520px; }
  .p-over { position: static; grid-column: 1; grid-row: 1; padding: 6px 0 4px; }
  .poster h1 { margin-top: clamp(40px, 9vh, 96px); font-size: clamp(80px, 9.6vw, 136px); }
  .p-sub { font-size: 19px; margin-top: 18px; }
  .p-side { margin-top: 44px; grid-template-columns: 84px minmax(0, 260px); gap: 18px; padding-top: 16px; }
  .p-side .th { width: 84px; }
  .p-txt { font-size: 14px; } .p-txt b { font-size: 15px; }
  .cta { padding: 14px 24px; }

  .lead { grid-template-columns: 220px minmax(0, 1fr); align-items: baseline; padding-block: 64px 20px; }
  .lead p { font-size: 22px; }
  .strip { grid-auto-flow: row; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-columns: auto; overflow: visible; gap: 18px; }
  .sec-head { padding-block: 48px 20px; }
  .sec-head h2 { font-size: 40px; }
  .plates { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 28px; }

  .dish { display: grid; grid-template-columns: minmax(0, 420px) minmax(0, 1fr); gap: 64px; align-items: start; }
  .dish-l { position: sticky; top: 70px; }
  .dish-r > .sec-head:first-child { padding-top: 46px; }
  .dish-r .flow { max-width: 560px; }

  .veil { align-items: center; }
  .sheet { border: 1px solid var(--ink); }
  .sheet.full { max-width: 760px; height: min(100%, 860px); border: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .intro .poster h1, .intro .p-side, .intro .p-cta { animation: rise .6s ease; }
  .p-side { animation-delay: .12s; } .p-cta { animation-delay: .2s; }
  @keyframes rise { from { transform: translateY(8px); } to { transform: none; } }
}

const FRAC = { "½": 0.5, "⅓": 1 / 3, "¼": 0.25, "⅔": 2 / 3 };
const UNIT_ABBR = [["стакан", "стак."], ["ломтик", "ломт."], ["зубчик", "зубч."], ["лист", "лист."], ["кружочк", "круж."], ["дольк", "дол."], ["банк", "банк."], ["кочан", "кочан."]];
const QTY_RE = /^(по )?(\d+(?:[.,]\d+)?|[½⅓¼⅔])\s*(г|мл|кг|л|шт|ст\. л\.|ч\. л\.|стакан[а-я]*|ломтик[а-я]*|зубчик[а-я]*|лист[а-я]*|кружочк[а-я]*|дольк[а-я]*|банк[а-я]*|кочан[а-я]*)(?![а-я])/;
function parseQty(q) {
  const m = q.match(QTY_RE);
  if (!m) return null;
  const ab = UNIT_ABBR.find(u => m[3].startsWith(u[0]));
  return { pre: m[1] || "", val: FRAC[m[2]] ?? parseFloat(m[2].replace(",", ".")), unit: ab ? ab[1] : m[3], rest: q.slice(m[0].length) };
}
function fmtNum(v, unit) {
  if (unit === "г" || unit === "мл") return String(Math.max(5, Math.round(v / 5) * 5));
  if (unit === "шт" && v >= 1) return String(Math.round(v));

  return v % 1 ? `${Math.floor(v) || ""}½` : String(v);
}

  if (k === 1) return q;
  const p = parseQty(q);

  return `${p.pre}${fmtNum(p.val * k, p.unit)} ${p.unit}${p.rest.replace(/\s*\([^)]*\)/, "")}`;
}
